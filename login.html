<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/style.css">

<body>

<header>
    <div class="logo">
    <img src="assets/logo.png" alt="Chicago Fire Domain Logo" style="height:80px;">
</div>

    <nav>
        <a href="index.html">Home</a>

<section class="hero">
    <h2>Member Login</h2>
    <p>Sign in to access your member dashboard.</p>

    <form style="max-width:400px;margin:40px auto;text-align:left;">
        <label>Email</label><br>
        <input type="email" placeholder="Enter your email"
        style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;"><br>

        <label>Password</label><br>
        <input type="password" placeholder="Enter your password"
        style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;"><br><br>

        <button class="btn" style="width:100%;">
            Login
        </button>
    </form>

</section>

</footer>
